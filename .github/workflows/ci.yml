name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  JAVA_VERSION: '11'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'
      
      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate Lint Baseline (if not exists)
        run: |
          if [ ! -f app/lint-baseline.xml ]; then
            ./gradlew updateLintBaseline || true
          fi

      - name: Upload lint baseline
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: ignore

      - name: Run Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Run Unit tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  build-release:
    name: Build release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download lint baseline
        uses: actions/download-artifact@v3.1.0
        with:
          name: lint-baseline
          path: app/

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease
